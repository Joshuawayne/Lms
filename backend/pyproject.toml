[project]
name = "jjenga-lms-backend"
version = "0.1.0"
description = "FastAPI foundation for the Jjenga Code learning management system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.40,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "mypy>=1.16,<2",
  "import-linter>=2,<3",
  "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules stay independent of HTTP and database adapters"
type = "forbidden"
source_modules = [
  "app.modules.identity.domain",
  "app.modules.people.domain",
  "app.modules.programs.domain",
  "app.modules.content.domain",
  "app.modules.activities.domain",
  "app.modules.attendance.domain",
  "app.modules.submissions.domain",
  "app.modules.assessments.domain",
  "app.modules.portfolios.domain",
  "app.modules.guidance.domain",
  "app.modules.reports.domain",
  "app.modules.imports.domain",
  "app.modules.media.domain",
  "app.modules.live_classes.domain",
  "app.modules.notifications.domain",
  "app.modules.certificates.domain",
  "app.modules.audit.domain",
  "app.shared.domain",
]
